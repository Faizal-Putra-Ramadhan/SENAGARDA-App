name: senagarda_control
description: Aplikasi kontrol SENAGARDA Rover - NAWASENA PPK Ormawa RDC UAD
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  cupertino_icons: ^1.0.6
  fl_chart: ^1.2.0
  web_socket_channel: ^3.0.3
  flutter_map: ^8.3.2
  latlong2: ^0.9.0
  flutter_map_mbtiles: ^1.0.4
  mbtiles: ^0.4.2
  path_provider: ^2.1.6
  sqlite3_flutter_libs: ^0.5.42
dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/rover_foto.png
    - assets/images/rover_top.png
    - assets/map/karangtengahMao.mbtiles

  fonts : 
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700 # 700 artinya Bold
